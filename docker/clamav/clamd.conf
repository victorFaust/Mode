# Mounted over /etc/clamav/clamd.conf. Same as the image defaults, plus a stream limit above Files:MaxSizeMb.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# Keep at least 10% above Files:MaxSizeMb (100 MB by default); larger uploads are marked as failed scans.
StreamMaxLength 110M
MaxScanSize 400M
MaxFileSize 110M
